name: Generate Sigstore signatures and md5sum for Releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要处理的特定发布标签（如需处理所有发布，请留空）'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  process-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Get list of releases to process
        id: get_releases
        run: |
          # 判断触发方式
          if [ "${{ github.event_name }}" == "release" ]; then
            # Release 触发：只处理当前发布的 tag
            releases="${{ github.event.release.tag_name }}"
          else
            # workflow_dispatch 触发：根据输入处理
            if [ -z "${{ github.event.inputs.release_tag }}" ]; then
              releases=$(gh release list --json tagName --jq '.[].tagName')
            else
              releases="${{ github.event.inputs.release_tag }}"
            fi
          fi
          echo "releases<<EOF" >> $GITHUB_OUTPUT
          echo "$releases" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Process each release
        run: |
          echo "${{ steps.get_releases.outputs.releases }}" | while read tag; do
              if [ -z "$tag" ]; then
                  continue
              fi
              echo "========================================="
              echo "处理 Release: $tag"
              echo "========================================="

              assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
              tgz_files=$(echo "$assets" | grep '^harbor-offline-installer-aarch64-.*\.tgz$' || true)

              if [ -z "$tgz_files" ]; then
                echo "在 Release $tag 中未找到 aarch64 tgz 文件，跳过。"
                continue
              fi
              echo "找到的 tgz 文件：$tgz_files"

              tmp_dir="${{ github.workspace }}/temp_signing_$tag"
              mkdir -p "$tmp_dir"
              cd "$tmp_dir"

              # 下载所有需要的 tgz 文件
              for file in $tgz_files; do
                echo "下载 $file ..."
                gh release download "$tag" --pattern "$file" --dir .
              done

              # 为每个 tgz 文件生成 .sigstore.json 签名（如果缺失）
              for file in $tgz_files; do
                sigfile="${file}.sigstore.json"
                if echo "$assets" | grep -q "^$sigfile$"; then
                  echo "签名文件 $sigfile 已存在，跳过。"
                else
                  echo "为 $file 生成 Sigstore 签名 ..."
                  cosign sign-blob --yes --output-signature "$sigfile" "$file"
                  echo "上传 $sigfile 到 Release $tag ..."
                  success=0
                  for attempt in {1..5}; do
                    if gh release upload "$tag" "$sigfile" --clobber; then
                      success=1
                      break
                    else
                      echo "上传失败 (尝试 $attempt/5)，5秒后重试..."
                      sleep 5
                    fi
                  done
                  if [ $success -eq 0 ]; then
                    echo "错误：上传 $sigfile 失败，已重试5次。"
                    exit 1
                  fi
                fi
              done

              # 检查并生成 md5sum 文件（如果缺失）
              if echo "$assets" | grep -q "^md5sum$"; then
                echo "md5sum 文件已存在，跳过。"
              else
                echo "生成 md5sum 文件 ..."
                md5sum $tgz_files > md5sum
                echo "上传 md5sum 到 Release $tag ..."
                success=0
                for attempt in {1..3}; do
                  if gh release upload "$tag" "md5sum" --clobber; then
                    success=1
                    break
                  else
                    echo "上传失败 (尝试 $attempt/3)，5秒后重试..."
                    sleep 5
                  fi
                done
                if [ $success -eq 0 ]; then
                  echo "错误：上传 md5sum 失败，已重试3次。"
                  exit 1
                fi
              fi

              cd "${{ github.workspace }}"
              rm -rf "$tmp_dir"
              echo "完成处理 Release $tag"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}